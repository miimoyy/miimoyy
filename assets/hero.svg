<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="1" stop-color="#0c0c0d"/>
    </linearGradient>
    <radialGradient id="dglow" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dgrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="dname" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8e8e93"/>
    </linearGradient>
    <linearGradient id="dsheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0.1"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="440" fill="url(#dbg)"/>
  <rect width="1280" height="440" fill="url(#dgrid)"/>
  <ellipse cx="640" cy="240" rx="520" ry="230" fill="url(#dglow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <rect x="0" y="0" width="1280" height="3" fill="#10b981" opacity="0.8"/>
  <rect x="0" y="437" width="1280" height="3" fill="#10b981" opacity="0.35"/>

  <g stroke="#3f3f46" stroke-width="2">
    <path d="M 36 30 h 16 M 44 22 v 16"/>
    <path d="M 1228 30 h 16 M 1236 22 v 16"/>
    <path d="M 36 394 h 16 M 44 386 v 16"/>
    <path d="M 1228 394 h 16 M 1236 386 v 16"/>
  </g>

  <g fill="#a1a1aa">
    <circle cx="200" cy="380" r="2.5" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="8s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -130" dur="8s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="400" r="2" opacity="0">
      <animate attributeName="opacity" values="0;0.4;0" dur="9s" begin="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -140" dur="9s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="400" r="2" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="8.5s" begin="1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -130" dur="8.5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="380" r="2.5" opacity="0">
      <animate attributeName="opacity" values="0;0.4;0" dur="9.5s" begin="3.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -120" dur="9.5s" begin="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="640" y="82" text-anchor="middle" font-family="'SF Mono', Consolas, monospace" font-size="19" letter-spacing="10" fill="#a1a1aa">HELLO, I'M</text>
  <text x="640" y="180" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="1" fill="url(#dname)">Rully Alislami</text>
  <rect x="500" y="204" width="280" height="2" fill="url(#dsheen)"/>
  <text x="640" y="250" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="24" letter-spacing="3" fill="#d4d4d8">Backend Developer — Network &amp; Server Operations</text>

  <g font-family="'SF Mono', Consolas, monospace" font-size="23" text-anchor="middle">
    <text x="640" y="300" fill="#34d399" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.27;0.33" dur="12s" begin="0s" repeatCount="indefinite"/>
      $ Node.js backends
    </text>
    <text x="640" y="300" fill="#34d399" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.27;0.33" dur="12s" begin="3s" repeatCount="indefinite"/>
      $ Laravel APIs
    </text>
    <text x="640" y="300" fill="#34d399" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.27;0.33" dur="12s" begin="6s" repeatCount="indefinite"/>
      $ Docker deploys
    </text>
    <text x="640" y="300" fill="#34d399" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.27;0.33" dur="12s" begin="9s" repeatCount="indefinite"/>
      $ stable networks
    </text>
  </g>

  <g font-family="'SF Mono', Consolas, monospace" font-size="16" font-weight="700">
    <rect x="532" y="330" width="216" height="44" rx="22" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="576" cy="352" r="6" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="660" y="358" text-anchor="middle" fill="#ecfdf5" letter-spacing="2">OPEN TO WORK</text>
  </g>
</svg>
