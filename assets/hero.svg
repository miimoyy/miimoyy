<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <radialGradient id="hglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hgrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="hsheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0.15"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="440" fill="url(#hbg)"/>
  <rect width="1280" height="440" fill="url(#hgrid)"/>
  <rect x="0" y="0" width="1280" height="4" fill="#0ea5e9"/>
  <rect x="0" y="436" width="1280" height="4" fill="#0ea5e9" opacity="0.5"/>
  <ellipse cx="640" cy="220" rx="480" ry="220" fill="url(#hglow)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="#67e8f9">
    <circle cx="180" cy="380" r="3" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="8s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -140" dur="8s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="400" r="2.5" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="9s" begin="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -150" dur="9s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="400" r="2.5" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="8.5s" begin="1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -140" dur="8.5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="380" r="3" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="9.5s" begin="3.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -130" dur="9.5s" begin="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="640" y="78" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" letter-spacing="10" fill="#67e8f9">HELLO, I'M</text>
  <text x="640" y="172" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="88" font-weight="800" fill="#ffffff">Rully Alislami</text>
  <rect x="490" y="196" width="300" height="3" rx="1.5" fill="url(#hsheen)"/>
  <text x="640" y="242" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="25" letter-spacing="2" fill="#cbd5e1">Backend Developer — Network &amp; Server Operations</text>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-style="italic" text-anchor="middle">
    <text x="640" y="292" fill="#67e8f9" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.27;0.33" dur="12s" begin="0s" repeatCount="indefinite"/>
      I craft Node.js backends
    </text>
    <text x="640" y="292" fill="#67e8f9" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.27;0.33" dur="12s" begin="3s" repeatCount="indefinite"/>
      I craft Laravel APIs
    </text>
    <text x="640" y="292" fill="#67e8f9" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.27;0.33" dur="12s" begin="6s" repeatCount="indefinite"/>
      I craft Docker deploys
    </text>
    <text x="640" y="292" fill="#67e8f9" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.27;0.33" dur="12s" begin="9s" repeatCount="indefinite"/>
      I craft stable networks
    </text>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700">
    <rect x="530" y="322" width="220" height="46" rx="23" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="578" cy="345" r="6" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="656" y="351" text-anchor="middle" fill="#e0f2fe" letter-spacing="2">OPEN TO WORK</text>
  </g>
</svg>
