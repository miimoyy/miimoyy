<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="180" viewBox="0 0 1280 180">
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="tglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="1264" height="164" rx="18" fill="#0b1220" opacity="0.94" stroke="#164e63" stroke-width="1.5"/>
  <rect x="8" y="8" width="1264" height="164" rx="18" fill="url(#tglow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="40" y="30" width="120" height="4" rx="2" fill="#0ea5e9"/>
  <text x="52" y="118" font-family="Georgia, serif" font-size="90" fill="#164e63">“</text>
  <text x="640" y="92" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="800" fill="url(#sheen)">APIs that don't go down</text>
  <text x="640" y="132" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="23" letter-spacing="3" fill="#94a3b8">FROM LOCALHOST TO PRODUCTION</text>
  <rect x="1120" y="30" width="120" height="4" rx="2" fill="#0ea5e9"/>
</svg>
