<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="5" fill="#0ea5e9"/>
  <rect x="0" y="355" width="1280" height="5" fill="#0ea5e9" opacity="0.55"/>

  <ellipse cx="980" cy="180" rx="330" ry="170" fill="url(#glowR)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- floating particles -->
  <g fill="#67e8f9">
    <circle cx="150" cy="300" r="3" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="7s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -120" dur="7s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="320" r="2.5" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="8s" begin="1.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -140" dur="8s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="310" r="3" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="9s" begin="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -110" dur="9s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="320" r="2.5" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="7.5s" begin="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -130" dur="7.5s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1210" cy="300" r="3" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="8.5s" begin="4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -100" dur="8.5s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="320" r="2" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="6.5s" begin="0.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -120" dur="6.5s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- terminal -->
  <g>
    <rect x="70" y="60" width="500" height="240" rx="14" fill="#060b16" opacity="0.92" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="98" cy="86" r="7" fill="#f87171"/>
    <circle cx="122" cy="86" r="7" fill="#fbbf24"/>
    <circle cx="146" cy="86" r="7" fill="#34d399"/>
    <text x="175" y="92" font-family="Consolas, monospace" font-size="15" fill="#475569">rully@prod: ~</text>
    <g font-family="Consolas, monospace" font-size="20">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.4s" fill="freeze"/>
        <text x="100" y="135" fill="#22d3ee">$ whoami</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.1s" fill="freeze"/>
        <text x="100" y="168" fill="#cbd5e1">rully-alislami — backend dev</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.9s" fill="freeze"/>
        <text x="100" y="201" fill="#22d3ee">$ stack --list</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.6s" fill="freeze"/>
        <text x="100" y="234" fill="#cbd5e1">node · laravel · mysql · docker</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.4s" fill="freeze"/>
        <text x="100" y="267" fill="#22d3ee">$ status</text>
        <circle cx="205" cy="260" r="6" fill="#34d399">
          <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
        </circle>
        <text x="222" y="267" fill="#34d399">open to work</text>
        <rect x="352" y="252" width="12" height="22" fill="#67e8f9">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>

  <!-- name block -->
  <g>
    <text x="640" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="66" font-weight="800" fill="#ffffff">Rully Alislami</text>
    <rect x="642" y="168" width="0" height="5" rx="2.5" fill="url(#bar)">
      <animate attributeName="width" from="0" to="200" dur="1.2s" begin="0.5s" fill="freeze"/>
    </rect>
    <text x="642" y="212" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#67e8f9">Backend Developer &#8226; Network &#38; Server Ops</text>
    <text x="642" y="250" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#94a3b8">Bogor, Indonesia &#160;&#160;·&#160;&#160; rullyportfolio.page.gd</text>
    <g font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.6s" fill="freeze"/>
      <rect x="642" y="266" width="220" height="44" rx="22" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <text x="752" y="295" text-anchor="middle" fill="#e0f2fe">OPEN TO WORK</text>
    </g>
  </g>
</svg>
